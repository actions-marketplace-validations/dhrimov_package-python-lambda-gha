[project]
name = "orders-lambda"
version = "0.1.0"
description = "One half of the multi-lambda fixture for the action's end-to-end tests."
requires-python = ">=3.11"
dependencies = [
    # A compiled dependency on purpose - see the single fixture for why.
    "orjson==3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders_lambda"]
