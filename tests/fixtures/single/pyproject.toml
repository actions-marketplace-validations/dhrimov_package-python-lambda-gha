[project]
name = "single-lambda"
version = "0.1.0"
description = "Small single-lambda fixture for the action's end-to-end tests."
requires-python = ">=3.11"
dependencies = [
    # A compiled dependency on purpose: it ships version- and arch-specific
    # manylinux wheels (orjson.cpython-<ver>-<arch>-linux-gnu.so), which is the
    # only thing that makes the platform/python-version matrix jobs differ.
    "orjson==3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/single_lambda"]
