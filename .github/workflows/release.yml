name: Release

# The Release itself is created by hand in the web UI, because that is the only
# way to publish to GitHub Marketplace. This workflow only follows it up by
# moving v1.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: move v1 to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      # The release trigger has no tag filter, and action-update-semver finds
      # the tag to move by cutting the last two dot-separated parts off the
      # release tag. Without this check, a release on foo.bar.baz would
      # force-move foo, and one on v2.0.0-rc1 would move v2.
      - name: Check the release tag is vX.Y.Z
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release tag is not vX.Y.Z: $TAG"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only publish Releases on vX.Y.Z tags. Immutable releases stop the tag
      # of a published release from being moved or deleted, and v1 works as a
      # floating alias only because it is a bare tag with no Release on it.
      # Publish one on v1 and the alias freezes there, then every later run of
      # the step below starts failing - months later, far from the cause.
      - name: Move the floating v1 tag to this commit
        uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 # v1.5.1
        with:
          github_token: ${{ github.token }}
          # Major only: v1 is the alias this action's README points callers
          # at, and a v1.2 tag would be one more thing to keep track of for no
          # gain.
          major_version_tag_only: "true"
