version: 2

updates:
  # Keeps this action's own SHA pins current - both the ones in action.yml and
  # the ones in .github/workflows. Dependabot rewrites the SHA and the trailing
  # "# vX.Y.Z" comment together, which is why the pins are written that way.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  # The fixtures pin their dependencies exactly, on purpose: the E2E matrix
  # asserts the exact name of the extension module orjson ships, and the large
  # fixture's pins are what keep it over AWS's 250 MiB unzipped limit. Bumping
  # either is a hand edit, not a Dependabot PR, so there is no pip ecosystem
  # entry here.
